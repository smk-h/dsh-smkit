<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打开与关闭，差在哪</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1140px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.75rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1140px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State · 注册生命周期</p>
    <h1>打开与关闭，差在哪</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1140 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="install-lifecycle-title install-lifecycle-desc">
        <title id="install-lifecycle-title">打开与关闭，差在哪</title>
        <desc id="install-lifecycle-desc">开关关闭时工具表只有 MCP 工具，模型看到全部定义；打开后多出三个入口并装上拦截钩子，关闭或卸载时一并撤销。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- arrows first -->
        <line x1="68" y1="270" x2="120" y2="270" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>

        <line x1="480" y1="230" x2="660" y2="230" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="540" y="202" width="64" height="20" rx="2" fill="#f5f5f5"/>
        <text x="572" y="217" fill="#bf4520" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">打开开关</text>

        <line x1="660" y1="310" x2="480" y2="310" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
        <rect x="506" y="320" width="132" height="20" rx="2" fill="#f5f5f5"/>
        <text x="572" y="335" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">关闭开关 / 卸载插件</text>

        <!-- start dot -->
        <circle cx="60" cy="270" r="8" fill="#2d3142"/>
        <text x="60" y="302" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">插件启动</text>

        <!-- state: closed -->
        <rect x="120" y="200" width="360" height="140" rx="8" fill="#f5f5f5"/>
        <rect x="120" y="200" width="360" height="140" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <rect x="424" y="212" width="44" height="20" rx="2" fill="transparent" stroke="rgba(79,93,117,0.35)" stroke-width="0.8"/>
        <text x="446" y="226" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">默认</text>
        <text x="300" y="238" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">开关关闭</text>
        <text x="300" y="272" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">工具表：只有 mcp__*</text>
        <text x="300" y="300" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">模型：看到全部工具定义</text>

        <!-- state: open -->
        <rect x="660" y="200" width="360" height="140" rx="8" fill="#f5f5f5"/>
        <rect x="660" y="200" width="360" height="140" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.4"/>
        <text x="840" y="238" fill="#bf4520" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">开关打开</text>
        <text x="840" y="272" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">工具表：多出 3 个入口</text>
        <text x="840" y="300" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">模型：只看到这 3 个入口</text>

        <text x="660" y="180" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">配置为 true 时，插件启动即处于此态</text>

        <!-- notes -->
        <text x="120" y="400" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">打开：注册 3 个入口，并装上拦截直调的 guard 与提示词钩子。</text>
        <text x="120" y="428" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">关闭：三样一起撤销；安装失败则回滚，开关保持原值。</text>

        <!-- legend -->
        <line x1="120" y1="462" x2="1020" y2="462" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="120" y="492" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LEGEND</text>
        <circle cx="212" cy="487" r="7" fill="#2d3142"/>
        <text x="228" y="492" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">启动入口</text>
        <rect x="320" y="478" width="16" height="16" rx="3" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="346" y="492" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">稳定状态</text>
        <line x1="436" y1="486" x2="472" y2="486" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
        <text x="482" y="492" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">切换动作</text>
      </svg>
    </div>
  </div>
</body>
</html>
